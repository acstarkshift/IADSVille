name: Deploy to GitHub Pages

on:
  push:
    # The repository's default branch, which is where the game actually lives.
    # This said `main` for the whole life of the project and there has never
    # been a branch by that name: the workflow was never registered, the API
    # 404s on it, and not one commit had ever reached the published page. The
    # player was reporting fixes as missing that had been merged for days.
    branches: [claude/iadsville-radar-game-ad6cq1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older one rather than
# racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests before publishing
        run: npm test
      - uses: actions/configure-pages@v5
      # The repository root is the site: index.html plus static ES modules, no
      # build step and nothing to bundle.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
