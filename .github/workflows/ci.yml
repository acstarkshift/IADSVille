name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # IADSVille has no dependencies: the engine is plain ES modules and the
      # tests run on node's built-in runner, so there is nothing to install.
      - name: Run tests
        run: npm test

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.49.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Load and play each mission headlessly
        run: node tools/smoke.js
