<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IADSVille</title>
<meta name="description" content="Run the radar picture for an integrated air defence sector. Assign tracks, manage emissions, and survive the raid.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%2340ff9e' stroke-width='2'/><path d='M16 16 L16 4' stroke='%2340ff9e' stroke-width='2'/><circle cx='16' cy='16' r='2' fill='%2340ff9e'/></svg>">
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/panel.css">
<link rel="stylesheet" href="styles/hud.css">
</head>
<body data-theme="crt-green">

<div id="shell" class="shell" hidden>
  <header class="topbar">
    <div class="topbar-group">
      <!-- Every legend below is stamped from src/ui/lexicon.js at boot, so the
           panel and the table it is meant to come from cannot drift apart. -->
      <span class="data-plate" id="unit-plate"></span>
      <span class="badge" id="mission-name">—</span>
      <span class="readout" title="Mission clock"><label data-legend="STATUS.clock" data-gloss-only></label><b id="clock">0:00</b></span>
      <span class="readout" title="Raid aircraft still airborne"><label data-legend="STATUS.airborne" data-gloss-only></label><b id="air-count">0</b></span>
      <span class="readout" title="Rounds expended against allocation"><label data-legend="STATUS.rounds" data-gloss-only></label><b id="rounds">0/0</b></span>
      <span class="lamps" id="master-lamps"></span>
    </div>
    <!--
      The card reader, and the operator's identity card standing out of it.

      The player's reference for this was a photograph: a white smart card
      pushed halfway into a black desktop reader with a row of status lamps
      on top. That is what this is — a reader mounted in the console's top
      strip, its lamps live (power, card read, a directive waiting), and the
      card leaning out of the slot toward the operator with the holder's
      name, photograph, rank and insignia, appointment and service number on
      it. Filled by renderIdCard() in panels.js.
    -->
    <div class="topbar-group">
      <div class="reader" id="card-reader">
        <span class="reader-top">
          <span class="reader-emblem"></span>
          <span class="reader-leds">
            <i class="led is-blue" id="led-power" title="Power"></i>
            <i class="led is-green" id="led-card" title="Card read"></i>
            <i class="led is-amber" id="led-net" title="Lit while a directive from the net is waiting for your answer"></i>
            <i class="led"></i>
          </span>
        </span>
        <span class="reader-front"><span class="reader-slot"></span></span>
        <span class="idcard" id="idcard" hidden></span>
      </div>
      <button class="pb" id="view-toggle" hidden title="Switch seat (V)"></button>
      <span class="readout standing" title="Your standing with sector command">
        <label data-legend="STATUS.standing" data-gloss-only></label><b id="standing">50</b>
        <span class="standing-bar"><i id="standing-fill"></i></span>
      </span>
    </div>
    <!--
      The rack: six caps, one geometry.

      Every control in this corner is the same height, machined the same way,
      with its key stencilled in the same corner chip. It was three idioms in
      four hundred pixels — a short cap with an inline chip, three tall
      two-line caps with a corner chip and a dim second line, and LEAVE POST
      as bare text with no housing at all — which is four treatments across
      six controls on the one strip that has to read as one piece of hardware.

      The keys used to be mapped by position, so 3 selected the cap marked 4×
      and 4 — the obvious reach for maximum speed — stopped the raid dead. The
      number stencilled on a cap is now the number that selects it.
    -->
    <div class="topbar-group rack">
      <span id="speed-group" role="radiogroup" aria-label="Simulation speed">
        <button class="pb" data-speed="0" role="radio" aria-checked="false" tabindex="-1"
          title="Hold — the simulation stops (0 or Space)">
          <span class="lg" data-legend="CONTROLS.speedHold" data-key="0"></span></button>
        <button class="pb is-down" data-speed="1" role="radio" aria-checked="true" tabindex="0"
          title="Real time (1)">
          <span class="lg" data-legend="CONTROLS.speedReal" data-key="1"></span></button>
        <button class="pb" data-speed="2" role="radio" aria-checked="false" tabindex="-1"
          title="Two times real time (2)">
          <span class="lg" data-legend="CONTROLS.speedFast" data-key="2"></span></button>
        <button class="pb" data-speed="4" role="radio" aria-checked="false" tabindex="-1"
          title="Four times real time (4)">
          <span class="lg" data-legend="CONTROLS.speedMax" data-key="4"></span></button>
      </span>
      <button class="pb" id="btn-help" title="Help (H)"><span class="lg"><b>HELP</b></span><em class="kc">H</em></button>
      <!--
        The one irreversible control on the console, housed as one.

        It was demoted to bare dim text on the reasoning that a destructive
        verb should not shout. That went too far: on a strip of machined caps
        a caption reads as a caption, and the control that ends the watch was
        the only thing in the bar a player could not see was a button. It is a
        cap like its neighbours now — same height, same shroud — but sunk into
        its housing and outlined in the alarm colour, which is how a guarded
        switch is distinguished on hardware. It still asks before it acts.
      -->
      <button class="pb pb-danger" id="btn-abort"
        title="Leave the post — this ends the watch and records it as abandoned"><span
          class="lg" data-legend="CONTROLS.abort"></span></button>
    </div>
  </header>

  <main class="stage">
    <section class="panel panel-left" id="panel-tracks">
      <h2><span class="lg" data-legend="STATUS.airPicture"></span>
        <span class="hint" id="fusion-state">FUSED</span></h2>
      <div class="track-head">
        <span title="Track number">TRACK</span><span title="What it is, or LOW/FAST by how it flies until it is identified">TYPE</span>
        <span title="Bearing from the centre of the watch, in degrees">BRG°</span>
        <span title="Range from the centre of the watch, in kilometres">RANGE</span>
        <span title="Height above the ground, in metres">HEIGHT</span>
        <span title="The battery that has it — under a battery's own heading, who else is on it. ◇ assigned, ◆ a round in the air, ▸ called to you by the net, OWN your own call">BATTERY</span>
      </div>
      <ol id="track-list" class="track-list" role="listbox" aria-label="Air tracks"></ol>
      <div class="flight-strip" id="flight-strip" hidden></div>
      <!-- The state of the board, standing where four contacts used to leave
           ninety per cent of this column flat black. See renderBoardState. -->
      <div class="board-state" id="board-state"></div>
      <div class="panel-foot" id="track-detail"></div>
    </section>

    <section class="scope-wrap bezel metal">
      <span class="screw a"></span><span class="screw b"></span>
      <span class="screw c"></span><span class="screw d"></span>
      <div class="tube">
        <canvas id="scope" aria-label="Radar display"></canvas>
        <div class="scope-overlay" id="scope-overlay"></div>
        <div class="scope-legend" id="scope-legend"></div>
        <div class="tutorial-card" id="tutorial-card" hidden></div>
      </div>
      <div class="scope-side" id="scope-side"></div>
    </section>

    <section class="panel panel-right" id="panel-batteries">
      <!-- The rack head says which card the keyboard is pointed at. The key
           chips are printed on the selected battery's caps only, but the caps
           on the cards below it look identically live, and nothing on the
           panel said that Q/W/E/R follow the highlight. Now the head does. -->
      <h2><span class="lg" data-legend="STATUS.weaponsPanel"></span>
        <span class="hint" id="rack-keys"></span></h2>
      <div id="formation-list" class="formation-list" hidden></div>
      <div id="battery-list" class="battery-list"></div>
      <div id="crew-console" class="crew-console" hidden></div>
    </section>
  </main>

  <footer class="ticker">
    <!--
      The thumb rail: the verbs of the watch, on the glass, at phone widths.

      On a phone the left panel is gone and the right one is a third of a short
      screen that scrolls, so the launch cap was off the bottom of a scroller in
      portrait and off the screen entirely in landscape — and a touch that moved
      the panel a pixel was cancelled and committed nothing. There was no way to
      fire a round with a finger. This rail carries whichever verbs the seat
      cannot be played without, never scrolls, and is thumb-sized;
      renderActionBar in panels.js fills it, and it goes through the same press
      path as every other cap on the console.

      It lives inside the ticker so that the command net — which floats above
      the ticker's top edge rather than growing it — clears the rail as well as
      the panels, instead of covering the launch cap with a directive.
    -->
    <div class="action-bar" id="action-bar" hidden></div>
    <div id="command-net" class="command-net" hidden>
      <div class="command-text" id="command-text"></div>
      <div class="command-actions">
        <button class="pb pb-accept" id="btn-accept"><span class="lg"
          data-legend="CONTROLS.acknowledge" data-key="Y"></span></button>
        <button class="pb pb-refuse" id="btn-refuse"><span class="lg"
          data-legend="CONTROLS.refuse" data-key="N"></span></button>
        <span class="command-timer" id="command-timer"></span>
      </div>
    </div>
    <ol id="event-log" class="event-log strip" aria-live="polite"></ol>
  </footer>

  <!-- The contact's menu: every battery that could take it, on a right click.
       Filled by src/ui/contextmenu.js. -->
  <div class="ctx-menu" id="context-menu" role="menu" aria-label="Batteries that can take this contact" hidden></div>

  <!-- Leaving the post is a decision the game scores, so it is confirmed like
       one, and the card states the cost before it is paid. The simulation
       deliberately keeps running underneath: this is a question, not a pause. -->
  <div class="ask" id="abort-ask" hidden role="dialog" aria-modal="true" aria-labelledby="abort-head">
    <div class="ask-card">
      <h2 id="abort-head"><span class="lg" data-legend="CONTROLS.abort"></span></h2>
      <p class="ask-line" id="abort-line"></p>
      <ul class="ask-costs">
        <li>The watch is recorded as <b>abandoned</b>. It is not scored.</li>
        <li>No points, no experience, no decoration, and no completion on the roster.</li>
        <li>Standing is charged for leaving the post.</li>
      </ul>
      <div class="ask-actions">
        <button class="pb pb-refuse" id="abort-confirm"><span class="lg"
          data-legend="CONTROLS.abandon"></span></button>
        <button class="pb pb-accept" id="abort-cancel"><span class="lg"
          data-legend="CONTROLS.stay" data-key="Esc"></span></button>
      </div>
    </div>
  </div>
</div>

<div id="screen" class="screen"></div>

<!--
  The scenes between watches: the printout in the operator's hands, the
  political section's office, the folder, the letter from home, the ending.
  A canvas 320 by 180 scaled in whole pixels, with the words laid over it as
  text. See src/ui/scenes.js.
-->
<div class="scene" id="scene" hidden data-kind="">
  <canvas aria-hidden="true"></canvas>
  <div class="scene-text" role="log" aria-live="polite">
    <span class="scene-speaker"></span>
    <div class="scene-body"></div>
    <span class="scene-prompt" aria-hidden="true"></span>
  </div>
  <button class="scene-skip" type="button" title="Skip (Esc)">SKIP ▸▸</button>
</div>

<script type="module" src="src/ui/app.js"></script>
<noscript>
  <p class="noscript">IADSVille needs JavaScript to run the simulation.</p>
</noscript>
</body>
</html>
