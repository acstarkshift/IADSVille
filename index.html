<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IADSVille</title>
<meta name="description" content="Run the radar picture for an integrated air defence sector. Assign tracks, manage emissions, and survive the raid.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%2340ff9e' stroke-width='2'/><path d='M16 16 L16 4' stroke='%2340ff9e' stroke-width='2'/><circle cx='16' cy='16' r='2' fill='%2340ff9e'/></svg>">
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/panel.css">
<link rel="stylesheet" href="styles/hud.css">
</head>
<body data-theme="crt-green">

<div id="shell" class="shell" hidden>
  <header class="topbar">
    <div class="topbar-group">
      <span class="data-plate" id="unit-plate">
        <b>ВПВО ТМ</b> · СЕКТОР 4-Б<br>ТИП 4М-2 · ЗАВ. № 118-44
      </span>
      <span class="badge" id="mission-name">—</span>
      <span class="readout" title="Mission clock"><label>ВРЕМЯ · TIME</label><b id="clock">0:00</b></span>
      <span class="readout" title="Raid aircraft still airborne"><label>В ВОЗДУХЕ · AIR</label><b id="air-count">0</b></span>
      <span class="readout" title="Rounds expended against allocation"><label>РАСХОД · EXPENDED</label><b id="rounds">0/0</b></span>
      <span class="lamps" id="master-lamps"></span>
    </div>
    <div class="topbar-group" id="speed-group">
      <button class="pb" data-speed="0" title="Pause (Space)"><span class="lg"><b>СТОП</b><i>HOLD</i></span></button>
      <button class="pb is-down" data-speed="1"><span class="lg"><b>1×</b><i>REAL</i></span></button>
      <button class="pb" data-speed="2"><span class="lg"><b>2×</b><i>FAST</i></span></button>
      <button class="pb" data-speed="4"><span class="lg"><b>4×</b><i>MAX</i></span></button>
    </div>
    <div class="topbar-group">
      <span class="operator" id="echelon-plate"></span>
      <span class="operator" id="operator-plate"></span>
      <button class="pb" id="view-toggle" hidden title="Switch seat (Tab)"><span class="lg"><b>ПОСТ</b><i>CONSOLE</i></span></button>
      <span class="readout standing" title="Your standing with sector command">
        <label>АТТЕСТАЦИЯ · STANDING</label><b id="standing">50</b>
        <span class="standing-bar"><i id="standing-fill"></i></span>
      </span>
      <button class="pb" id="btn-help" title="Help (H)"><span class="lg"><b>?</b><i>HELP</i></span></button>
      <button class="pb" id="btn-abort" title="Leave the mission"><span class="lg"><b>СДАТЬ</b><i>LEAVE</i></span></button>
    </div>
  </header>

  <main class="stage">
    <section class="panel panel-left" id="panel-tracks">
      <h2><span class="lg"><b>ВОЗДУШНАЯ ОБСТАНОВКА</b><i>AIR PICTURE</i></span>
        <span class="hint" id="fusion-state">FUSED</span></h2>
      <div class="track-head">
        <span title="Track number">TN</span><span title="Classification, or LOW/FAST kinematics until identified">TYPE</span>
        <span title="Bearing from the centre of the watch, degrees">BRG</span>
        <span title="Range, kilometres">RNG</span>
        <span title="Altitude in metres">ALT M</span>
        <span title="Batteries assigned; ◆ = rounds in the air">ASGN</span>
      </div>
      <ol id="track-list" class="track-list" role="listbox" aria-label="Air tracks"></ol>
      <div class="flight-strip" id="flight-strip" hidden></div>
      <div class="panel-foot" id="track-detail"></div>
    </section>

    <section class="scope-wrap bezel metal">
      <span class="screw a"></span><span class="screw b"></span>
      <span class="screw c"></span><span class="screw d"></span>
      <div class="tube">
        <canvas id="scope" aria-label="Radar display"></canvas>
        <div class="scope-overlay" id="scope-overlay"></div>
        <div class="scope-legend" id="scope-legend"></div>
      </div>
      <div class="scope-side" id="scope-side"></div>
    </section>

    <section class="panel panel-right" id="panel-batteries">
      <h2><span class="lg"><b>ОГНЕВЫЕ СРЕДСТВА</b><i>WEAPONS</i></span></h2>
      <div id="formation-list" class="formation-list" hidden></div>
      <div id="battery-list" class="battery-list"></div>
      <div id="crew-console" class="crew-console" hidden></div>
    </section>
  </main>

  <footer class="ticker">
    <div id="command-net" class="command-net" hidden>
      <div class="command-text" id="command-text"></div>
      <div class="command-actions">
        <button class="pb pb-accept" id="btn-accept"><span class="lg"><b>ПРИНЯТО</b><i>ACKNOWLEDGE · Y</i></span></button>
        <button class="pb pb-refuse" id="btn-refuse"><span class="lg"><b>ОТКАЗ</b><i>REFUSE · N</i></span></button>
        <span class="command-timer" id="command-timer"></span>
      </div>
    </div>
    <ol id="event-log" class="event-log strip" aria-live="polite"></ol>
  </footer>
</div>

<div id="screen" class="screen"></div>

<script type="module" src="src/ui/app.js"></script>
<noscript>
  <p style="color:#9fe;padding:2rem;font:14px monospace">IADSVille needs JavaScript to run the simulation.</p>
</noscript>
</body>
</html>
